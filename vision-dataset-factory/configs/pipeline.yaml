# Pipeline DAG definition for Vision Dataset Factory
pipeline:
  name: "off_beverages_pipeline"
  storage_dir: "storage"
  
  # Definition of all nodes in the DAG
  nodes:
    - name: "discover"
      plugin: "sources.openfoodfacts"
      depends_on: []
      config:
        categories: ["beverages"]
        limit_per_category: 15

    - name: "download"
      plugin: "downloader"
      depends_on: ["discover"]
      config:
        concurrency: 5
        timeout: 15
        user_agent: "VisionDatasetFactory/1.0"

    - name: "dedup"
      plugin: "deduplication"
      depends_on: ["download"]
      config:
        hash_size: 8
        high_pass: true

    - name: "quality"
      plugin: "quality_check"
      depends_on: ["dedup"]
      config:
        min_width: 224
        min_height: 224
        blur_threshold: 100.0  # Laplacian variance threshold

    - name: "annotate"
      plugin: "auto_annotation"
      depends_on: ["quality"]
      config:
        annotator: "plugins.annotators.grounding_dino.GroundingDinoAnnotator"
        prompt_template: "product packaging of {product_name}"
        min_confidence: 0.7

    - name: "export"
      plugin: "yolo_exporter"
      depends_on: ["annotate"]
      config:
        dataset_version: "off_beverages_dataset"
        split_ratio:
          train: 0.8
          val: 0.1
          test: 0.1
        label_field: "product"

